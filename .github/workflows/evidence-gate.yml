# ghosty-dev · puerta de evidencia (Ley 2: se revisa la evidencia, no el código).
# Falla el check del PR si algún pendiente que cierra («Closes #n») no tiene comentario de evidencia válido.
# Hazlo obligatorio en Settings → Branches → «Require status checks»: ghosty-dev/evidencia.
name: ghosty-dev
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
permissions:
  contents: read
  issues: read
  pull-requests: read
  checks: read
jobs:
  evidencia:
    name: ghosty-dev/evidencia
    runs-on: ubuntu-latest
    steps:
      # El script sale de la rama base: un PR no puede aflojar su propia puerta. Por NOMBRE (la punta actual de
      # la rama base), no por `base.sha`: ése es el commit base de cuando se abrió el PR y, en un PR abierto antes
      # de instalar ghosty-dev, todavía no trae gate.mjs (Formmy #73, 22-nov: MODULE_NOT_FOUND).
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          sparse-checkout: .github/ghosty-dev
      - run: node .github/ghosty-dev/gate.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
